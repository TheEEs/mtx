services:
  mediamtx:
    build: 
      context: ./mediamtx
      dockerfile: Dockerfile.mediamtx
    restart: unless-stopped
    ports:
      - 8889:8889 #for local development only
      - 8189:8189/udp
    networks:
      - mtx
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=localhost

  caddy:
    build: 
      context: ./caddy
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mtx

  app:
    extends:
      file: "./admin/.devcontainer/compose.yaml"
      service: app
    restart: unless-stopped
    environment:
      - MTX_LOCAL_HOST=mtx.localhost

volumes:
  caddy_data:
  caddy_config:

networks:
  mtx:
    name: mtx
