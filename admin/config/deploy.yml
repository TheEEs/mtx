# Name of your application. Used to uniquely configure containers.
service: admin

# Name of the container image (use your-user/app-name on external registries).
image: <%= ENV["KAMAL_REGISTRY_IMAGE"] || "ghcr.io/#{ENV.fetch('GITHUB_REPOSITORY', 'owner/mtx').downcase}/admin" %>

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("SERVER_IP", "127.0.0.1") %>
    # Caddy handles front-facing reverse proxy and SSL, so disable built-in kamal-proxy
    proxy: false

# Where you keep your container images.
registry:
  server: ghcr.io
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] || ENV.fetch("GITHUB_ACTOR", "owner") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - RESEND_API_KEY
  clear:
    # Run the Solid Queue Supervisor inside Puma process
    SOLID_QUEUE_IN_PUMA: true
    MEDIAMTX_HOST: admin-mediamtx

# Aliases are triggered with "bin/kamal <alias>"
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use persistent storage for SQLite databases and Active Storage files
volumes:
  - "admin_storage:/rails/storage"

# Asset bridge for fingerprinted assets
asset_path: /rails/public/assets

# Configure the image builder
builder:
  arch: amd64

# Accessory services managed by Kamal
accessories:
  mediamtx:
    image: <%= "ghcr.io/#{ENV.fetch('GITHUB_REPOSITORY', 'owner/mtx').downcase}/mediamtx:latest" %>
    host: <%= ENV.fetch("SERVER_IP", "127.0.0.1") %>
    options:
      publish:
        - "8890:8890/udp"
        - "8189:8189/udp"
        #- "8554:8554"
        #- "1935:1935"
        #- "8889:8889"
    files:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml
    env:
      clear:
        MTX_AUTHHTTPADDRESS: <%= 
            if host = ENV.fetch("GITHUB_SHA", nil)
              "http://admin-web-#{host}/rooms/auth"
            else
              "http://app:3000/rooms/auth"
            end
            %>
  caddy:
    image: <%= "ghcr.io/#{ENV.fetch('GITHUB_REPOSITORY', 'owner/mtx').downcase}/caddy:latest" %>
    host: <%= ENV.fetch("SERVER_IP", "127.0.0.1") %>
    options:
      publish:
        - "80:80"
        - "443:443"
        - "443:443/udp"
    files:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
    directories:
      - caddy_data:/data
      - caddy_config:/config
    env:
      secret:
        - LINODE_APIKEY
      clear:
        APP_HOST: admin-web-<%= ENV.fetch("GITHUB_SHA", "latest") %>
        MEDIAMTX_HOST: admin-mediamtx
