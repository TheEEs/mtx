name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================
  # CI: Lint, Security Audits, and Tests
  # ==========================================
  ci:
    name: Code Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips libyaml-dev sqlite3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: admin
          bundler-cache: true

      - name: Security scan (Brakeman)
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Security scan (Bundler Audit)
        run: bin/bundler-audit

      - name: Security scan (Importmap Audit)
        run: bin/importmap audit

      - name: Lint Ruby code (RuboCop)
        run: bin/rubocop -f github

      - name: Run Rails tests
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:test:prepare test

  # ==========================================
  # Docker Build Validation (runs on PRs too)
  # ==========================================
  build-test:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build Rails image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: false
          tags: test-admin:latest
          cache-from: type=gha

      - name: Test build Caddy image
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          file: ./caddy/Dockerfile.caddy
          push: false
          tags: test-caddy:latest
          cache-from: type=gha

      - name: Test build MediaMTX image
        uses: docker/build-push-action@v6
        with:
          context: ./mediamtx
          file: ./mediamtx/Dockerfile.mediamtx
          push: false
          tags: test-mediamtx:latest
          cache-from: type=gha

  # ==========================================
  # Build & Push Docker Images to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Images
    needs: [ ci, build-test ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        id: repo
        run: echo "NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # 1. Rails Admin App
      - name: Build and push Rails image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/admin:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.NAME }}/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Caddy Reverse Proxy
      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          file: ./caddy/Dockerfile.caddy
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/caddy:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.NAME }}/caddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. MediaMTX Streaming Server
      - name: Build and push MediaMTX image
        uses: docker/build-push-action@v6
        with:
          context: ./mediamtx
          file: ./mediamtx/Dockerfile.mediamtx
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/mediamtx:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.NAME }}/mediamtx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD: Deploy via Kamal
  # ==========================================
  deploy:
    name: Deploy with Kamal
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: admin
          bundler-cache: true

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Kamal Deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          LINODE_APIKEY: ${{ secrets.LINODE_APIKEY }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |

          # Boot accessory containers (MediaMTX & Caddy) if not running, or reboot them
          bin/kamal accessory reboot all || bin/kamal accessory boot all

          # Deploy Rails application with zero downtime
          bin/kamal deploy --version=${{ github.sha }}
